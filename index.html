<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Fun Coalition</title>
  <meta name="description" content="Anti-Fun Coalition - Capitola, California">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #f5f0eb;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    img {
      width: min(70vw, 70vh, 480px);
      height: auto;
    }
    p {
      font-family: 'Aptos', 'Calibri', 'Gill Sans', 'Segoe UI', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #2a2a2a;
      font-size: clamp(1.5rem, 4vw, 2.8rem);
      font-weight: 400;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Anti-Fun Coalition">
  <p>Committed to dissatisfaction</p>
</body>
</html>
